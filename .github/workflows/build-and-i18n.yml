name: 构建与翻译更新

'on':
  push:
    branches: [main]
    tags:
      - "*"
    paths:
      - "src/**/*.py"
      - "src/**/*.qml"
      - "assets/locales/*.ts"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '2.0.0.dev31546377'
        type: string
      version_type:
        description: '版本类型'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - stable
      upload2webdav:
        description: '上传到...'
        required: true
        default: 'None'
        type: choice
        options:
          - None
          - 123Pan
      update_ts_files:
        description: '是否更新 .ts 文件'
        required: true
        default: true
        type: boolean
      compile_to_qm:
        description: '是否编译 .qm 文件'
        required: true
        default: true
        type: boolean
      release:
        description: '创建 GitHub Release'
        required: true
        default: false
        type: boolean

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ========== 翻译更新任务 ==========
  detect-changes:
    name: 检查文件变更
    runs-on: ubuntu-latest
    outputs:
      has_py_changes: ${{ steps.detect.outputs.has_py_changes }}
      has_qml_changes: ${{ steps.detect.outputs.has_qml_changes }}
      has_ts_changes: ${{ steps.detect.outputs.has_ts_changes }}
      should_update_ts: ${{ steps.detect.outputs.should_update_ts }}
      should_compile_qm: ${{ steps.detect.outputs.should_compile_qm }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 检测文件变更
        id: detect
        shell: bash
        run: |
          has_py_changes="false"
          has_qml_changes="false"
          has_ts_changes="false"
          should_update_ts="false"
          should_compile_qm="false"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              changed_files=$(git diff --name-only HEAD~1 HEAD)
            else
              changed_files=$(git diff-tree --no-commit-id --name-only -r HEAD)
            fi

            echo "[DEBUG] 变更文件:"
            echo "$changed_files"

            if echo "$changed_files" | grep -qE '^src/.+\.py$'; then
              has_py_changes="true"
            fi
            if echo "$changed_files" | grep -qE '^src/.+\.qml$'; then
              has_qml_changes="true"
            fi
            if echo "$changed_files" | grep -qE '^assets/locales/.+\.ts$'; then
              has_ts_changes="true"
            fi

            if [[ "$has_py_changes" == "true" || "$has_qml_changes" == "true" || "$has_ts_changes" == "true" ]]; then
              should_update_ts="true"
              should_compile_qm="true"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_update_ts="${{ github.event.inputs.update_ts_files }}"
            should_compile_qm="${{ github.event.inputs.compile_to_qm }}"
            echo "[DEBUG] 手动触发 - update_ts=$should_update_ts compile_qm=$should_compile_qm"
          fi

          echo "has_py_changes=$has_py_changes" >> "$GITHUB_OUTPUT"
          echo "has_qml_changes=$has_qml_changes" >> "$GITHUB_OUTPUT"
          echo "has_ts_changes=$has_ts_changes" >> "$GITHUB_OUTPUT"
          echo "should_update_ts=$should_update_ts" >> "$GITHUB_OUTPUT"
          echo "should_compile_qm=$should_compile_qm" >> "$GITHUB_OUTPUT"

          {
            echo "## 文件变更"
            echo "| 文件类型 | 状态 |"
            echo "|----------|------|"
            echo "| .py | $has_py_changes |"
            echo "| .qml | $has_qml_changes |"
            echo "| .ts | $has_ts_changes |"
            echo "| 更新 .ts | $should_update_ts |"
            echo "| 编译 .qm | $should_compile_qm |"
          } >> "$GITHUB_STEP_SUMMARY"

  update-translations:
    name: 更新翻译文件
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_update_ts == 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 变基到最新分支
        shell: bash
        run: |
          git fetch origin
          git rebase origin/${{ github.ref_name }}

      - name: 安装 Python 和 uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: 安装 PySide6 工具
        shell: bash
        run: |
          uv pip install "PySide6~=6.9.3"

      - name: 更新翻译源文件
        shell: bash
        run: |
          echo "[DEBUG] 更新 assets/locales/*.ts"
          mapfile -t source_files < <(find src -type f \( -name "*.py" -o -name "*.qml" \) | sort)

          if [ ${#source_files[@]} -eq 0 ]; then
            echo "[DEBUG] 未找到可提取翻译的源文件"
            exit 0
          fi

          for ts_file in assets/locales/*.ts; do
            if [ -f "$ts_file" ]; then
              echo "[DEBUG] 更新 $(basename "$ts_file")"
              pyside6-lupdate "${source_files[@]}" -ts "$ts_file"
            fi
          done

      - name: 提交更新的 .ts 文件
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: |
            chore(i18n): update ts files

            - actor: ${{ github.actor }}
            - event: ${{ github.event_name }}
            - sha: ${{ github.sha }}
            - run: ${{ github.run_id }}
          commit_options: "--no-verify --signoff"
          file_pattern: "assets/locales/*.ts"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"

  compile-translations:
    name: 编译翻译文件
    runs-on: ubuntu-latest
    needs: [detect-changes, update-translations]
    if: |
      always() &&
      needs.detect-changes.outputs.should_compile_qm == 'true' &&
      (needs.update-translations.result == 'success' || needs.update-translations.result == 'skipped')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 变基到最新分支
        shell: bash
        run: |
          git fetch origin
          git rebase origin/${{ github.ref_name }}

      - name: 安装 Python 和 uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: 安装 PySide6 工具
        shell: bash
        run: |
          uv pip install "PySide6~=6.9.3"

      - name: 编译 .qm 文件
        shell: bash
        run: |
          for ts_file in assets/locales/*.ts; do
            if [ -f "$ts_file" ]; then
              qm_file="${ts_file%.ts}.qm"
              echo "[DEBUG] 编译 $(basename "$ts_file") -> $(basename "$qm_file")"
              pyside6-lrelease "$ts_file" -qm "$qm_file"
            fi
          done

      - name: 提交编译后的 .qm 文件
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: |
            chore(i18n): compile qm files

            - actor: ${{ github.actor }}
            - event: ${{ github.event_name }}
            - sha: ${{ github.sha }}
            - run: ${{ github.run_id }}
          commit_options: "--no-verify --signoff"
          file_pattern: "assets/locales/*.qm"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"

  summary:
    name: 执行摘要
    runs-on: ubuntu-latest
    needs: [detect-changes, update-translations, compile-translations]
    if: always()
    steps:
      - name: 生成摘要
        shell: bash
        run: |
          {
            echo "### 执行状态"
            echo "| 任务 | 状态 |"
            echo "|------|------|"
            echo "| 检测变更 | ${{ needs.detect-changes.result }} |"
            echo "| 更新翻译 | ${{ needs.update-translations.result }} |"
            echo "| 编译翻译 | ${{ needs.compile-translations.result }} |"
            echo ""
            echo "### 触发信息"
            echo "- **触发事件**: ${{ github.event_name }}"
            echo "- **分支**: ${{ github.ref_name }}"
            echo "- **提交**: ${{ github.sha }}"
            echo "- **执行时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- **更新 .ts**: ${{ github.event.inputs.update_ts_files }}"
              echo "- **编译 .qm**: ${{ github.event.inputs.compile_to_qm }}"
            fi
            echo ""
            echo "### 变更结果"
            echo "- **Python 文件变更**: ${{ needs.detect-changes.outputs.has_py_changes }}"
            echo "- **QML 文件变更**: ${{ needs.detect-changes.outputs.has_qml_changes }}"
            echo "- **翻译源文件变更**: ${{ needs.detect-changes.outputs.has_ts_changes }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ========== 构建发布任务 ==========
  build:
    name: 构建应用
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 和 uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION_TYPE="${{ inputs.version_type }}"
            VERSION_TAG="${VERSION}"
          else
            VERSION_TAG="${{ github.ref_name }}"
            VERSION="${VERSION_TAG#v}"
            VERSION_TYPE="stable"

            if [[ "$VERSION" =~ (^|[-._])alpha([-.0-9]*)?$ ]]; then
              VERSION_TYPE="alpha"
              VERSION="${VERSION%%-alpha*}"
              VERSION="${VERSION%%.alpha*}"
              VERSION="${VERSION%%_alpha*}"
            elif [[ "$VERSION" =~ (^|[-._])dev([-.0-9]*)?$ ]]; then
              VERSION_TYPE="alpha"
            elif [[ "$VERSION" =~ (^|[-._])beta([-.0-9]*)?$ ]]; then
              VERSION_TYPE="beta"
              VERSION="${VERSION%%-beta*}"
              VERSION="${VERSION%%.beta*}"
              VERSION="${VERSION%%_beta*}"
            fi
          fi

          PRERELEASE="true"
          if [[ "$VERSION_TYPE" == "stable" ]]; then
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 写入版本号到源码
        shell: bash
        env:
          CW_VERSION: ${{ steps.version.outputs.version }}
          CW_VERSION_TYPE: ${{ steps.version.outputs.version_type }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('src/__init__.py')
          content = path.read_text(encoding='utf-8')
          content = re.sub(r'__version__ = ["\'][^"\']*["\']', f'__version__ = "{os.environ["CW_VERSION"]}"', content)
          content = re.sub(r'__version_type__ = ["\'][^"\']*["\']', f'__version_type__ = "{os.environ["CW_VERSION_TYPE"]}"', content)
          path.write_text(content, encoding='utf-8')
          PY

          grep -E '^__version__|^__version_type__' src/__init__.py

      - name: 安装依赖
        shell: bash
        run: |
          uv sync
          uv pip install pyinstaller

      - name: 构建应用 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run pyinstaller --noconsole \
            --icon "assets/images/logo.ico" \
            --add-data "src/qml:src/qml" \
            --add-data "src/plugins:src/plugins" \
            --add-data "src/themes:src/themes" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --paths=. \
            --contents-directory . \
            --name="Class Widgets 2" \
            src/app.py

      - name: 构建应用 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run pyinstaller --noconsole \
            --icon "assets/images/logo.icns" \
            --add-data "src/qml:src/qml" \
            --add-data "src/plugins:src/plugins" \
            --add-data "src/themes:src/themes" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --paths=. \
            --contents-directory . \
            --name="Class Widgets 2" \
            src/app.py

      - name: 清理 PySide6 文件 (仅 Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TARGET="dist/Class Widgets 2/PySide6"
          JSON_FILE="$GITHUB_WORKSPACE/scripts/qt_files_clean-Windows.json"
          
          if [ -d "$TARGET" ] && [ -f "$JSON_FILE" ]; then
            jq -r '.[]' "$JSON_FILE" | while IFS= read -r item; do
              item=${item%$'\r'}
              full_path="$TARGET/$item"
              if [ -f "$full_path" ] || [ -d "$full_path" ]; then
                rm -rf "$full_path"
                echo "已清理: $item"
              fi
            done
          fi

      - name: 打包 zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Class Widgets 2/*" -DestinationPath "dist/ClassWidgets-2-Windows.zip"

      - name: 打包 dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "Class Widgets 2" -srcfolder dist -ov -format UDZO ClassWidgets-2-macOS-${{ runner.arch }}.dmg

      - name: 上传构建产物 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClassWidgets-2-Windows
          path: dist/ClassWidgets-2-Windows.zip

      - name: 上传构建产物 (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ClassWidgets-2-macOS-${{ runner.arch }}
          path: ClassWidgets-2-macOS-${{ runner.arch }}.dmg

  release:
    name: 发布到 GitHub
    needs: [build]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION_TYPE="${{ inputs.version_type }}"
            VERSION_TAG="${VERSION}"
          else
            VERSION_TAG="${{ github.ref_name }}"
            VERSION="${VERSION_TAG#v}"
            VERSION_TYPE="stable"

            if [[ "$VERSION" =~ (^|[-._])alpha([-.0-9]*)?$ ]]; then
              VERSION_TYPE="alpha"
              VERSION="${VERSION%%-alpha*}"
              VERSION="${VERSION%%.alpha*}"
              VERSION="${VERSION%%_alpha*}"
            elif [[ "$VERSION" =~ (^|[-._])beta([-.0-9]*)?$ ]]; then
              VERSION_TYPE="beta"
              VERSION="${VERSION%%-beta*}"
              VERSION="${VERSION%%.beta*}"
              VERSION="${VERSION%%_beta*}"
            fi
          fi

          PRERELEASE="true"
          if [[ "$VERSION_TYPE" == "stable" ]]; then
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Class Widgets ${{ steps.version.outputs.version_tag }}
          tag_name: ${{ steps.version.outputs.version_tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/ClassWidgets-2-Windows.zip
            dist/ClassWidgets-2-macOS-X64.dmg
            dist/ClassWidgets-2-macOS-ARM64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到 123Pan
        if: success() && github.event.inputs.upload2webdav == '123Pan'
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"
          ENCODED_VERSION=$(echo "$VERSION" | sed 's/ /%20/g')

          curl -v -u "${{ secrets.PAN_USER }}:${{ secrets.PAN_PASS }}" \
               -X MKCOL "https://webdav.123pan.cn/webdav/${ENCODED_VERSION}"

          curl -u "${{ secrets.PAN_USER }}:${{ secrets.PAN_PASS }}" \
            -T "dist/ClassWidgets-2-Windows.zip" \
            "https://webdav.123pan.cn/webdav/${ENCODED_VERSION}/ClassWidgets-2-Windows.zip"

          curl -u "${{ secrets.PAN_USER }}:${{ secrets.PAN_PASS }}" \
            -T "dist/ClassWidgets-2-macOS-X64.dmg" \
            "https://webdav.123pan.cn/webdav/${ENCODED_VERSION}/ClassWidgets-2-macOS-X64.dmg"

          curl -u "${{ secrets.PAN_USER }}:${{ secrets.PAN_PASS }}" \
            -T "dist/ClassWidgets-2-macOS-ARM64.dmg" \
            "https://webdav.123pan.cn/webdav/${ENCODED_VERSION}/ClassWidgets-2-macOS-ARM64.dmg"
